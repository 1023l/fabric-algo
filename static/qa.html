<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>产线数据问答</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: "Segoe UI", "Microsoft YaHei", sans-serif; background: #f5f6f8; height: 100vh; display: flex; flex-direction: column; }
  header { background: #1e293b; color: #fff; padding: 12px 20px; font-size: 16px; font-weight: 600; display: flex; justify-content: space-between; align-items: center; }
  header a { color: #93c5fd; font-size: 13px; text-decoration: none; font-weight: 400; }
  #chat { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
  .msg { max-width: 78%; padding: 10px 14px; border-radius: 12px; line-height: 1.6; font-size: 14px; white-space: pre-wrap; word-break: break-word; }
  .msg.user { align-self: flex-end; background: #2563eb; color: #fff; border-bottom-right-radius: 4px; }
  .msg.bot { align-self: flex-start; background: #fff; color: #1e293b; border: 1px solid #e2e8f0; border-bottom-left-radius: 4px; }
  .msg.bot.error { background: #fef2f2; border-color: #fca5a5; color: #b91c1c; }
  .trace { align-self: flex-start; max-width: 78%; font-size: 12px; color: #64748b; background: #f8fafc; border: 1px dashed #cbd5e1; border-radius: 10px; padding: 8px 12px; }
  .trace .step { margin: 4px 0; }
  .trace .tool { color: #7c3aed; font-family: Consolas, monospace; font-size: 11px; }
  .thinking { color: #94a3b8; font-style: italic; }
  footer { padding: 14px 20px; background: #fff; border-top: 1px solid #e2e8f0; display: flex; gap: 10px; }
  #q { flex: 1; padding: 10px 14px; border: 1px solid #cbd5e1; border-radius: 10px; font-size: 14px; outline: none; }
  #q:focus { border-color: #2563eb; }
  #send { padding: 10px 22px; background: #2563eb; color: #fff; border: none; border-radius: 10px; font-size: 14px; cursor: pointer; }
  #send:disabled { background: #94a3b8; cursor: not-allowed; }
  .sugs { display: flex; gap: 8px; flex-wrap: wrap; padding: 0 20px 10px; }
  .sugs button { padding: 6px 12px; background: #eff6ff; color: #1d4ed8; border: 1px solid #bfdbfe; border-radius: 16px; font-size: 12px; cursor: pointer; }
</style>
</head>
<body>
<header>产线数据问答 Agent <a href="/">← 返回检测界面</a></header>
<div id="chat">
  <div class="msg bot">你好，我可以查询产线检测计数的真实数据。试试下面的例子，或直接输入问题。</div>
</div>
<div class="sugs">
  <button onclick="ask(this.textContent)">今天产量多少？</button>
  <button onclick="ask(this.textContent)">现在累计多少片？</button>
  <button onclick="ask(this.textContent)">今天鞋码分布？</button>
  <button onclick="ask(this.textContent)">最近3小时每小时产量趋势</button>
</div>
<footer>
  <input id="q" placeholder="例如：今天上午产了多少片？30 码的有几片？" onkeydown="if(event.key==='Enter')send()">
  <button id="send" onclick="send()">发送</button>
</footer>
<script>
const chat = document.getElementById('chat');
const qInput = document.getElementById('q');
const sendBtn = document.getElementById('send');
let busy = false;

function addMsg(cls, text) {
  const div = document.createElement('div');
  div.className = 'msg ' + cls;
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

function addTrace() {
  const div = document.createElement('div');
  div.className = 'trace';
  div.innerHTML = '<div class="thinking">思考中…</div>';
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

function renderTrace(el, data) {
  el.innerHTML = '';
  if (data.thought) {
    const s = document.createElement('div');
    s.className = 'step';
    s.textContent = data.thought;
    el.appendChild(s);
  }
  (data.tool_calls || []).forEach(tc => {
    const t = document.createElement('div');
    t.className = 'tool';
    t.textContent = `⚙ ${tc.name}(${(tc.arguments || '').slice(0, 120)})`;
    el.appendChild(t);
  });
  chat.scrollTop = chat.scrollHeight;
}

async function send() {
  const question = qInput.value.trim();
  if (!question || busy) return;
  qInput.value = '';
  busy = true; sendBtn.disabled = true;
  addMsg('user', question);
  const trace = addTrace();
  const bot = addMsg('bot', '');
  let answer = '';

  try {
    const resp = await fetch('/api/qa/ask/stream', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question }),
    });
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      const parts = buf.split('\n\n');
      buf = parts.pop();
      for (const p of parts) {
        const line = p.trim();
        if (!line.startsWith('data:')) continue;
        const data = JSON.parse(line.slice(5));
        renderTrace(trace, data);
        if (data.is_final) { answer = data.answer || '(空回答)'; }
      }
    }
  } catch (e) {
    answer = '请求失败：' + e.message;
  }

  if (answer.startsWith('Agent 运行出错') || answer.startsWith('LLM 未配置') || answer.startsWith('请求失败')) {
    bot.classList.add('error');
  }
  bot.textContent = answer;
  if (!answer) { bot.textContent = '(无回答，请查看服务日志)'; bot.classList.add('error'); }
  trace.remove();
  busy = false; sendBtn.disabled = false;
  qInput.focus();
}

function ask(text) { qInput.value = text; send(); }
</script>
</body>
</html>
